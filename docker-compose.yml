# =============================================================================
# ClawControl  —  Multi-Agent OpenClaw Stack
#
# ─────────────────────────────────────────────────────────────────────────────
# YAML anchors — shared config blocks reused across services
# ─────────────────────────────────────────────────────────────────────────────
x-openclaw-common: &openclaw-common
  image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
  init: true
  restart: unless-stopped
  networks:
    - agent-net

x-chromium-common: &chromium-common
  build:
    context: ./docker/chromium-cdp-proxy
  image: local/chromium-cdp-proxy:latest
  restart: unless-stopped
  shm_size: 2gb
  networks:
    - agent-net
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "1"

# =============================================================================
#  SERVICES
# =============================================================================
services:

  # ───────────────────────────────────────────────────────────────────────────
  #  OB1 — Shared Database (PostgreSQL 16 + pgvector)
  # ───────────────────────────────────────────────────────────────────────────
  ob1-db:
    image: pgvector/pgvector:pg16
    container_name: ob1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ob1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openbrain}
    volumes:
      - ${DATA_ROOT}/ob1/pgdata:/var/lib/postgresql/data
      - ./ob1/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${OB1_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ob1} -d ${POSTGRES_DB:-openbrain}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # ───────────────────────────────────────────────────────────────────────────
  #  OB1 — PostgREST (REST API for the OB1 database)
  # ───────────────────────────────────────────────────────────────────────────
  ob1-rest:
    image: postgrest/postgrest:v14.8
    container_name: ob1-rest
    restart: unless-stopped
    depends_on:
      ob1-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER:-ob1}:${POSTGRES_PASSWORD}@ob1-db:5432/${POSTGRES_DB:-openbrain}"
      PGRST_DB_SCHEMAS: "public,orchestrator,agent1,agent2"
      PGRST_DB_ANON_ROLE: "${POSTGRES_USER:-ob1}"
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: "${PGRST_JWT_SECRET:-}"
      PGRST_DB_EXTRA_SEARCH_PATH: "public"
    ports:
      - "${OB1_REST_PORT:-3100}:3000"
    networks:
      - agent-net

  # ───────────────────────────────────────────────────────────────────────────
  #  OB1 — Per-agent MCP servers (schema-pinned memory tools over MCP)
  # ───────────────────────────────────────────────────────────────────────────
  ob1-mcp-orchestrator:
    build:
      context: ./ob1/mcp-server
    container_name: ob1-mcp-orchestrator
    restart: unless-stopped
    depends_on:
      ob1-db:
        condition: service_healthy
    environment:
      DB_HOST: ob1-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-openbrain}
      DB_USER: ${POSTGRES_USER:-ob1}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OB1_SCHEMA: orchestrator
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_API_BASE: ${OB1_EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${OB1_EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      MCP_ACCESS_KEY: ${ORCHESTRATOR_OB1_MCP_ACCESS_KEY:-}
      PORT: 8000
    networks:
      - agent-net

  ob1-mcp-agent1:
    build:
      context: ./ob1/mcp-server
    container_name: ob1-mcp-agent1
    restart: unless-stopped
    depends_on:
      ob1-db:
        condition: service_healthy
    environment:
      DB_HOST: ob1-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-openbrain}
      DB_USER: ${POSTGRES_USER:-ob1}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OB1_SCHEMA: agent1
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_API_BASE: ${OB1_EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${OB1_EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      MCP_ACCESS_KEY: ${AGENT1_OB1_MCP_ACCESS_KEY:-}
      PORT: 8000
    networks:
      - agent-net

  ob1-mcp-agent2:
    build:
      context: ./ob1/mcp-server
    container_name: ob1-mcp-agent2
    restart: unless-stopped
    depends_on:
      ob1-db:
        condition: service_healthy
    environment:
      DB_HOST: ob1-db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-openbrain}
      DB_USER: ${POSTGRES_USER:-ob1}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      OB1_SCHEMA: agent2
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_API_BASE: ${OB1_EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${OB1_EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${OB1_EMBEDDING_MODEL:-openai/text-embedding-3-small}
      MCP_ACCESS_KEY: ${AGENT2_OB1_MCP_ACCESS_KEY:-}
      PORT: 8000
    networks:
      - agent-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml
      - ${DATA_ROOT}/searxng/logs:/var/log/uwsgi
      - ${DATA_ROOT}/searxng-cache:/var/cache/searxng
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "1"
    networks:
      - agent-net

  # ───────────────────────────────────────────────────────────────────────────
  #  PRESTART — Ensure openclaw mount ownership
  # ───────────────────────────────────────────────────────────────────────────
  openclaw-mount-permissions:
    image: node:22-alpine
    container_name: openclaw-mount-permissions
    restart: "no"
    environment:
      DATA_ROOT: ${DATA_ROOT:-}
    volumes:
      - .:${COMPOSE_REPO_MOUNT_PATH:-/compose-files}
    command:
      - "node"
      - "${COMPOSE_REPO_MOUNT_PATH:-/compose-files}/scripts/openclaw-mount-permissions.mjs"
      - "${COMPOSE_REPO_MOUNT_PATH:-/compose-files}"
    networks:
      - agent-net
  # ═══════════════════════════════════════════════════════════════════════════
  #  ORCHESTRATOR — The agent that manages the fleet
  # ═══════════════════════════════════════════════════════════════════════════

  openclaw-orchestrator:
    <<: *openclaw-common
    build:
      context: ./docker/openclaw-orchestrator
      args:
        BASE_IMAGE: ${OPENCLAW_ORCHESTRATOR_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: local/openclaw-orchestrator:latest
    container_name: openclaw-orchestrator
    group_add:
      - "${DOCKER_GID}"
    depends_on:
      ob1-db:
        condition: service_healthy
      ob1-mcp-orchestrator:
        condition: service_started
      openclaw-mount-permissions:
        condition: service_completed_successfully
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${TZ:-Europe/Berlin}
      OPENCLAW_GATEWAY_TOKEN: ${ORCHESTRATOR_GATEWAY_TOKEN:-}
      ORCHESTRATOR_GATEWAY_PORT: ${ORCHESTRATOR_GATEWAY_PORT:-18789}
      TELEGRAM_BOT_TOKEN: ${ORCHESTRATOR_TELEGRAM_BOT_TOKEN:-}
      # Model provider keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # OB1 connection info (available inside the container)
      OB1_DB_URL: "postgres://${POSTGRES_USER:-ob1}:${POSTGRES_PASSWORD}@ob1-db:5432/${POSTGRES_DB:-openbrain}"
      OB1_REST_URL: "http://ob1-rest:3000"
      OB1_SCHEMA: orchestrator
      OB1_MCP_URL: "http://ob1-mcp-orchestrator:8000"
      OB1_MCP_ACCESS_KEY: ${ORCHESTRATOR_OB1_MCP_ACCESS_KEY:-}
    volumes:
      # Own config + workspace
      - ${DATA_ROOT}/openclaw-orchestrator/.openclaw:/home/node/.openclaw
      - ${DATA_ROOT}/openclaw-orchestrator/workspace:/home/node/.openclaw/workspace
      # Seed config (copied on first start if no config exists)
      - ./configs/orchestrator/openclaw.json:/seed/openclaw.json:ro
      # ── Orchestrator-only mounts ──
      # Read/write access to every other agent's config
      - ${DATA_ROOT}/openclaw-agent1/.openclaw:/mounted-agents/agent1/.openclaw
      - ${DATA_ROOT}/openclaw-agent2/.openclaw:/mounted-agents/agent2/.openclaw
      # Access to the compose stack (so the orchestrator can edit it)
      - .:${COMPOSE_REPO_MOUNT_PATH:-/compose-files}
      # Docker socket for running compose commands
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${ORCHESTRATOR_GATEWAY_PORT:-18789}:${ORCHESTRATOR_GATEWAY_PORT:-18789}"
      - "${ORCHESTRATOR_BRIDGE_PORT:-18790}:${ORCHESTRATOR_BRIDGE_PORT:-18790}"
    command:
      - "/bin/sh"
      - "-c"
      - |
        test -f /home/node/.openclaw/openclaw.json || cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
        node -e 'const fs=require("fs");const f="/home/node/.openclaw/openclaw.json";const j=JSON.parse(fs.readFileSync(f,"utf8"));const raw=process.env.OPENCLAW_GATEWAY_PORT ?? process.env.ORCHESTRATOR_GATEWAY_PORT;const p=Number(raw);if(!Number.isInteger(p)||p<1||p>65535){throw new Error("Invalid gateway port env value");}j.gateway={...(j.gateway||{}),port:p};fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");'
        mkdir -p /home/node/.openclaw/workspace
        if [ -d ${COMPOSE_REPO_MOUNT_PATH:-/compose-files}/workspace-seed/orchestrator ] && [ -z "$(ls -A /home/node/.openclaw/workspace 2>/dev/null)" ]; then
          cp -a ${COMPOSE_REPO_MOUNT_PATH:-/compose-files}/workspace-seed/orchestrator/. /home/node/.openclaw/workspace/
        fi
        exec node dist/index.js gateway --bind lan --port ${ORCHESTRATOR_GATEWAY_PORT:-18789}
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "fetch('http://127.0.0.1:${ORCHESTRATOR_GATEWAY_PORT:-18789}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════════════════
  #  AGENT 1 — Worker agent
  # ═══════════════════════════════════════════════════════════════════════════

  openclaw-agent1:
    <<: *openclaw-common
    image: ${OPENCLAW_AGENT1_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-agent1
    networks:
      - agent-net
      - agent1-browser-net
    depends_on:
      ob1-db:
        condition: service_healthy
      ob1-mcp-agent1:
        condition: service_started
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${TZ:-Europe/Berlin}
      OPENCLAW_GATEWAY_TOKEN: ${AGENT1_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_PORT: ${AGENT1_GATEWAY_PORT:-18791}
      TELEGRAM_BOT_TOKEN: ${AGENT1_TELEGRAM_BOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OB1_DB_URL: "postgres://${POSTGRES_USER:-ob1}:${POSTGRES_PASSWORD}@ob1-db:5432/${POSTGRES_DB:-openbrain}"
      OB1_REST_URL: "http://ob1-rest:3000"
      OB1_SCHEMA: agent1
      OB1_MCP_URL: "http://ob1-mcp-agent1:8000"
      OB1_MCP_ACCESS_KEY: ${AGENT1_OB1_MCP_ACCESS_KEY:-}
      BROWSER_CDP_URL: "http://chromium-agent1:9223"
    volumes:
      - ${DATA_ROOT}/openclaw-agent1/.openclaw:/home/node/.openclaw
      - ${DATA_ROOT}/openclaw-agent1/workspace:/home/node/.openclaw/workspace
      - ./configs/agent1/openclaw.json:/seed/openclaw.json:ro
    ports:
      - "${AGENT1_GATEWAY_PORT:-18791}:${AGENT1_GATEWAY_PORT:-18791}"
      - "${AGENT1_BRIDGE_PORT:-18792}:${AGENT1_BRIDGE_PORT:-18792}"
    command:
      - "/bin/sh"
      - "-c"
      - |
        test -f /home/node/.openclaw/openclaw.json || cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
        node -e 'const fs=require("fs");const f="/home/node/.openclaw/openclaw.json";const j=JSON.parse(fs.readFileSync(f,"utf8"));const raw=process.env.OPENCLAW_GATEWAY_PORT ?? process.env.ORCHESTRATOR_GATEWAY_PORT;const p=Number(raw);if(!Number.isInteger(p)||p<1||p>65535){throw new Error("Invalid gateway port env value");}j.gateway={...(j.gateway||{}),port:p};fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");'
        exec node dist/index.js gateway --bind lan --port ${AGENT1_GATEWAY_PORT:-18791}
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "fetch('http://127.0.0.1:${AGENT1_GATEWAY_PORT:-18791}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  chromium-agent1:
    <<: *chromium-common
    container_name: chromium-agent1
    networks:
      - agent1-browser-net
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: 1000
      PGID: 1000
      CUSTOM_HTTPS_PORT: 3001
      CHROME_CLI: "--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=*"
      DISPLAY: ":1"
      START_DOCKER: "true"
      PIXELFLUX_WAYLAND: "true"          # Much better performance + lower CPU (recommended)
      MAX_RESOLUTION: "1920x1080"
    volumes:
      - ${DATA_ROOT}/chromium-agent1:/config:rw
    ports:
      - "${AGENT1_CHROMIUM_UI_PORT:-3002}:3001"

  # ═══════════════════════════════════════════════════════════════════════════
  #  AGENT 2 — Worker agent
  # ═══════════════════════════════════════════════════════════════════════════

  openclaw-agent2:
    <<: *openclaw-common
    image: ${OPENCLAW_AGENT2_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-agent2
    networks:
      - agent-net
      - agent2-browser-net
    depends_on:
      ob1-db:
        condition: service_healthy
      ob1-mcp-agent2:
        condition: service_started
    environment:
      HOME: /home/node
      TERM: xterm-256color
      TZ: ${TZ:-Europe/Berlin}
      OPENCLAW_GATEWAY_TOKEN: ${AGENT2_GATEWAY_TOKEN:-}
      OPENCLAW_GATEWAY_PORT: ${AGENT2_GATEWAY_PORT:-18793}
      TELEGRAM_BOT_TOKEN: ${AGENT2_TELEGRAM_BOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OB1_DB_URL: "postgres://${POSTGRES_USER:-ob1}:${POSTGRES_PASSWORD}@ob1-db:5432/${POSTGRES_DB:-openbrain}"
      OB1_REST_URL: "http://ob1-rest:3000"
      OB1_SCHEMA: agent2
      OB1_MCP_URL: "http://ob1-mcp-agent2:8000"
      OB1_MCP_ACCESS_KEY: ${AGENT2_OB1_MCP_ACCESS_KEY:-}
      BROWSER_CDP_URL: "http://chromium-agent2:9223"
    volumes:
      - ${DATA_ROOT}/openclaw-agent2/.openclaw:/home/node/.openclaw
      - ${DATA_ROOT}/openclaw-agent2/workspace:/home/node/.openclaw/workspace
      - ./configs/agent2/openclaw.json:/seed/openclaw.json:ro
    ports:
      - "${AGENT2_GATEWAY_PORT:-18793}:${AGENT2_GATEWAY_PORT:-18793}"
      - "${AGENT2_BRIDGE_PORT:-18794}:${AGENT2_BRIDGE_PORT:-18794}"
    command:
      - "/bin/sh"
      - "-c"
      - |
        test -f /home/node/.openclaw/openclaw.json || cp /seed/openclaw.json /home/node/.openclaw/openclaw.json
        node -e 'const fs=require("fs");const f="/home/node/.openclaw/openclaw.json";const j=JSON.parse(fs.readFileSync(f,"utf8"));const raw=process.env.OPENCLAW_GATEWAY_PORT ?? process.env.ORCHESTRATOR_GATEWAY_PORT;const p=Number(raw);if(!Number.isInteger(p)||p<1||p>65535){throw new Error("Invalid gateway port env value");}j.gateway={...(j.gateway||{}),port:p};fs.writeFileSync(f, JSON.stringify(j,null,2)+"\n");'
        exec node dist/index.js gateway --bind lan --port ${AGENT2_GATEWAY_PORT:-18793}
    healthcheck:
      test:
        [
          "CMD", "node", "-e",
          "fetch('http://127.0.0.1:${AGENT2_GATEWAY_PORT:-18793}/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  chromium-agent2:
    <<: *chromium-common
    container_name: chromium-agent2
    networks:
      - agent2-browser-net
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PUID: 1000
      PGID: 1000
      CUSTOM_HTTPS_PORT: 3001
      CHROME_CLI: "--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=*"
      DISPLAY: ":1"
      START_DOCKER: "true"
      PIXELFLUX_WAYLAND: "true"          # Much better performance + lower CPU (recommended)
      MAX_RESOLUTION: "1920x1080"
    volumes:
      - ${DATA_ROOT}/chromium-agent2:/config:rw
    ports:
      - "${AGENT2_CHROMIUM_UI_PORT:-3003}:3001"

  openclaw-nginx:
    image: nginx:1.27-alpine
    container_name: openclaw-nginx
    restart: unless-stopped
    environment:
      ORCHESTRATOR_GATEWAY_PORT: ${ORCHESTRATOR_GATEWAY_PORT:-18789}
      AGENT1_GATEWAY_PORT: ${AGENT1_GATEWAY_PORT:-18791}
      AGENT2_GATEWAY_PORT: ${AGENT2_GATEWAY_PORT:-18793}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - agent-net
      - agent1-browser-net
      - agent2-browser-net

networks:
  agent-net:
    driver: bridge
  agent1-browser-net:
    driver: bridge
    internal: true
  agent2-browser-net:
    driver: bridge
    internal: true

volumes:
  searxng-cache:
